<!doctype html><html lang="es"><meta charset="utf-8"><title>Revisión responsive</title><style>body{background:#ddd;font:14px Arial;margin:16px}nav{display:flex;gap:10px;margin-bottom:14px}button{padding:12px}iframe{border:0;background:white;display:block}label{align-self:center}</style><nav><button onclick="size(320,740)">320</button><button onclick="size(390,844)">390</button><button onclick="size(768,1024)">768</button><button onclick="size(1440,900)">1440</button><button onclick="document.querySelector('iframe').contentDocument.documentElement.style.fontSize='200%'">Texto 200%</button><button onclick="document.querySelector('iframe').contentDocument.documentElement.style.fontSize=''">Texto normal</button><label id="size">390 × 844</label></nav><iframe src="/" title="Portafolio" width="390" height="844"></iframe><script>function size(w,h){const f=document.querySelector('iframe');f.width=w;f.height=h;document.getElementById('size').textContent=w+' × '+h;}</script></html>
