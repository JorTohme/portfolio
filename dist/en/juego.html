  <!-- La hoja de Google Fonts se carga sin bloquear el pintado: media="print"
       la deja fuera del render critico y onload la devuelve a la pagina. La
       URL ya pide display=swap, asi que el texto nunca espera a la fuente. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" media="print" onload="this.media=&#39;all&#39;">

  <!-- Vercel Web Analytics. Va en head porque los shells de /en/ reemplazan
       el body entero y se llevarian puesto un script puesto ahi. -->
  <script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
  <script defer src="/_vercel/insights/script.js"></script>

<body>
  <noscript><p style="padding:2rem;font-family:system-ui">This page builds itself from the Spanish version with JavaScript. <a href="../juego.html" style="text-decoration:underline">Open the game in Spanish</a>.</p></noscript>
  <script type="module">
    // Same shell as /en/index.html. The game page keeps its styles inline, so
    // they are carried over from the source instead of being duplicated here.
    import { apply } from '../i18n.js';
    import { EN } from '../i18n/en.js';

    const source = await fetch('../juego.html').then(r => r.text());
    const doc = new DOMParser().parseFromString(source, 'text/html');
    apply(doc, EN);

    for (const style of doc.head.querySelectorAll('style')) document.head.append(style.cloneNode(true));
    for (const el of doc.body.querySelectorAll('[src],[srcset]')) {
      for (const attr of ['src', 'srcset']) {
        const v = el.getAttribute(attr);
        if (v && v.startsWith('./')) el.setAttribute(attr, '.' + v);
      }
    }
    doc.querySelectorAll('script').forEach(s => s.remove());

    document.body.innerHTML = doc.body.innerHTML;
    globalThis.__I18N = EN;
    await import('../game/game.js');
  </script>
</body>
